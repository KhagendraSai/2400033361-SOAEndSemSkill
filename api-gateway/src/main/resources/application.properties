spring.application.name=ApiGateway
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=account-service

spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081

spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/gateway/**

spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[0].filters[1]=PrefixPath=/internal